schema_version: 1
# Base lens model — all lens model YAMLs are deep-merged on top of this file.
# Only override the keys that differ from these defaults.
lens:
  # Camera type: pinhole | thinlens | realistic
  camera: pinhole

  # --- Pinhole parameters ---
  pinhole_fov_deg: 45.0

  # --- Thin-lens parameters ---
  thinlens_fov_deg: 45.0
  thinlens_lens_radius: 0.0
  thinlens_focal_distance: 1.0

  # --- Realistic lens parameters ---
  realistic_lensfile: null
  realistic_aperture_diameter_mm: null
  realistic_focus_distance: null
  # focal_length_mm: the image-space focal length of the lens prescription (mm).
  # Used to derive the effective f-number for radiance→irradiance conversion:
  #   N_eff = focal_length_mm / realistic_aperture_diameter_mm
  # Set this for every realistic-camera lens model; null triggers a fallback to
  # sensor.f_number with a warning (less accurate for multi-element systems).
  focal_length_mm: null

  # --- Radial / tangential distortion (Brown-Conrady model) ---
  # Used by the analytic sensor forward path (spectral_sensor_forward.py) to
  # correct the pixel→scene coordinate mapping.  Has no effect on the PBRT
  # realistic-lens path (distortion is handled physically by ray tracing).
  # k1, k2: radial coefficients (negative = barrel, positive = pincushion).
  # p1, p2: tangential (decentring) coefficients.  Typical phone wide-angle:
  #   k1 ≈ -0.05 to -0.15, k2 ≈ 0.01 to 0.05, p1/p2 ≈ 0.
  distortion_k1: 0.0
  distortion_k2: 0.0
  distortion_p1: 0.0
  distortion_p2: 0.0

  # --- Post-render PSF (applied to spectral EXR before electron integration) ---
  # Two modes:
  #   gaussian          – single sigma_pixels applied to every channel (legacy).
  #   chromatic_gaussian – σ(λ) = sqrt( (0.42·N·λ/(1000·pitch))² + σ_geom² )
  #                        f_number and pixel_pitch_um are read from sensor model.
  post_psf:
    enabled: false
    mode: chromatic_gaussian
    sigma_geometric_pixels: 0.50   # geometric-aberration baseline [px]
    sigma_pixels: 0.0              # used by 'gaussian' mode only
    # f_number: null               # override sensor.f_number  (null = use sensor value)
    # pixel_pitch_um: null         # override sensor.pixel_pitch_um (null = use sensor value)
    stray_light:
      enabled: false
      veiling_glare_fraction: 0.01
      halo_sigma_pixels: 15.0
      halo_strength: 0.01
