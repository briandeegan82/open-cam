schema_version: 1
# Phone-class wide-angle lens: f/2.51, 22 mm focal length (Nakamura wide-angle design).
# Suitable for: smartphone cameras (~1.0–1.4 µm pixel pitch).
# NOTE: wide_22mm.dat aperture stop is 8.756 mm diameter (f/2.51 at 22 mm).
# Requesting 12.2 mm (f/1.8) causes PBRT to silently clamp the aperture, producing
# incorrect vignetting and DOF.  Use 8.756 mm to match the physical prescription.
# A true f/1.8 simulation requires a different lens prescription.
lens:
  camera: realistic
  realistic_lensfile: config/lenses/wide_22mm.dat
  realistic_aperture_diameter_mm: 8.756   # physical maximum of wide_22mm.dat aperture stop
  realistic_focus_distance: 1.0
  focal_length_mm: 22.0  # wide_22mm.dat image-space focal length → effective f/2.51
  post_psf:
    enabled: false
    mode: chromatic_gaussian
    sigma_geometric_pixels: 0.35    # BSI pixel, tight optics
    stray_light:
      enabled: false
      veiling_glare_fraction: 0.015
      halo_sigma_pixels: 10.0
      halo_strength: 0.06
