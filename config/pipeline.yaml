paths:
  scene_builder: tools/build_colorchecker_scene.py
  pbrt: third_party/pbrt-v4/build/pbrt
  noise_tool: tools/apply_emva_noise.py
  sensor_forward_tool: tools/spectral_sensor_forward.py
  pbrt_exr_to_electrons_tool: tools/pbrt_spectral_exr_to_electrons.py
  validate_tool: tools/validate_colorchecker.py
  validate_demosaic_tool: tools/validate_demosaic_linear.py
  validate_emva_tool: tools/validate_emva_model.py
  emva_validation_report: out/emva_validation_report.json
  scene_file: scenes/generated/colorchecker.pbrt
  exr_out: out/colorchecker_spectral.exr
  camera_model_name: iphone_8
  sensor_forward_electrons_npz: out/sensor_forward_electrons.npz
  demosaic_metrics_json: out/demosaic_linear_metrics.json
  out_dir: out
  psf_tool: tools/apply_spectral_psf.py
render:
  light_scale: 1.0
  cam_dist: 4.0
  xres: 960
  yres: 640
  # Monte Carlo render noise after spectral integration scales as ~1.4%/sqrt(N/512)
  # in electron space.  Rule of thumb vs shot noise at 300 e:
  #   512   spp → ~1.4% electron CV → ~25% of shot noise  (fast iteration)
  #   4096  spp → ~0.5% electron CV → ~9%  of shot noise  (default final)
  #   16384 spp → ~0.25% electron CV → ~4%  of shot noise (archival quality)
  # Render time at 512 spp ≈ 4 min → scales linearly with spp.
  pixelsamples: 4096
  film: spectral
  film_output: null
  # 64 buckets → 7.3 nm/bucket over 360–830 nm. Sufficient for broad LED spectra and
  # most fluorescent line spectra. Increase to 128 (3.7 nm) for narrow-band illuminants
  # such as laser lines or phosphor-converted LEDs. 32 (14.7 nm) is too coarse for accurate
  # colour rendering under non-blackbody sources.
  spectral_nbuckets: 64
  spectral_lambda_min: 360.0
  spectral_lambda_max: 830.0
  # Optional repo-relative CSV override for scene illuminant spectrum.
  # Example: spectra/illuminant/interpolated/D65.csv
  illuminant: spectra/illuminant/interpolated/D65.csv
  builder_extra_args: []
  # GPU render path. When true, the pipeline injects --gpu (pbrt's OptiX GPU
  # wavefront renderer), which accelerates the dominant render stage. Requires a
  # pbrt binary built with OptiX support (see docs/guides/building_pbrt.md,
  # Step 3). NOTE: --wavefront alone runs on the CPU and does NOT use the GPU.
  # Keep this false until the OptiX-enabled pbrt build exists; then set true.
  gpu_enabled: true
  # Extra PBRT render CLI args, e.g. ["--stats"]. --gpu is injected automatically
  # when gpu_enabled: true (unless already present here).
  pbrt_args: ["--stats"]
validate:
  enabled: true
validate_emva:
  enabled: true
# Optional run-level override for lens.camera from the selected camera model.
# Set to null to use camera-model default; options: pinhole, thinlens, realistic.
lens_type_override: realistic
# Optional run-level lens parameter overrides (null = use camera-model value).
# Note: pinhole_fov_deg / thinlens_* keys only take effect when lens_type_override
# is set to pinhole or thinlens respectively.
lens_overrides:
  realistic_lensfile: null
  realistic_aperture_diameter_mm: null
  realistic_focus_distance: 4.0
strict_physical_accuracy:
  strict_qe_validation: false
  strict_calibration_validation: false
  calibration_tier_policy: semi_strict
exposure_time_override_s: 0.12   # iPhone 8 base ISO, f/2.51, 500 lux → ~6500e on white patches
sensor_forward:
  mode: pbrt_exr
  enabled: true
  # Optional global lux override for forward-model calibration.
  # null means "use target_illuminance_lux from the selected camera model".
  target_illuminance_lux: 500
noise:
  enabled: true
  seed: 0
  exposure_scale: null
  preview_percentile: 99.5
  preview_no_normalize: true
  # Optional preview overrides; null = use processing defaults from sensor model.
  preview_white_balance_enabled: true
  preview_color_correction_enabled: false
validate_demosaic:
  enabled: true
  crop: 2
