# Derived from research_realistic_wide22 for 3D highway scenes:
# radiometric_autocalibration: mean_photopic_lux normalizes the rendered
# EXR's mean photopic lux to calibration.target_illuminance_lux (chart-style
# illuminant-CSV normalization assumes uniform illumination and doesn't apply).
schema_version: 1
model:
  name: research_highway_wide22
  display_name: Research Highway Wide 22mm (mean-lux autocal)
lens:
  camera: realistic
  realistic_lensfile: config/lenses/wide_22mm.dat
  realistic_aperture_diameter_mm: 8.0    # matches build_highway_scene.py default
  realistic_focus_distance: 20.0
  focal_length_mm: 22.0                  # f/2.75; used for thin-lens radiometry
  # post_psf is used ONLY by the optional glare stage (GLARE=1 in
  # scripts/generate_highway.sh). sigma_pixels 0 = no extra blur (the traced
  # lens already provides aberrations); only the stray_light sub-models act.
  post_psf:
    enabled: true
    mode: gaussian
    sigma_pixels: 0.0
    stray_light:
      enabled: true
      veiling_glare_fraction: 0.02   # contrast wash from in-lens scatter
      halo_sigma_pixels: 16.0        # bloom around saturated sun/sky
      halo_strength: 0.03
      ghost_reflections:
        enabled: true
        ghost_strength: 0.015        # 180deg-rotated sun ghost
      aperture_diffraction:
        enabled: true
        n_blades: 6                  # starburst spikes
        strength: 0.04
        rotation_deg: 0.0
        psf_kernel_size: 128
sensor:
  quantum_efficiency:
    red_csv: spectra/QE/interpolated/QE_red.csv
    green_csv: spectra/QE/interpolated/QE_green.csv
    blue_csv: spectra/QE/interpolated/QE_blue.csv
    ircf_csv: spectra/QE/interpolated/QE_IRCF.csv
  pixel_pitch_um: 1.4
  integration_time_s: 0.01
  f_number: 2.0
  fill_factor: 0.95
noise:
  emva:
    overall_system_gain_K_e_per_DN: 4.77
    sigma_d_e: 2.6
    black_level_DN: 16
    use_poisson_shot_noise: true
    prnu_std_fraction: 0.01
    dsnu_std_e: 0.3
  adc:
    bit_depth: 10
    full_well_e: 4800
    clipping: hard
  processing:
    auto_exposure: false
    exposure_scale_e_per_unit: 1.0
    linear_exr_mode: integrate_qe
cfa:
  enabled: true
  pattern: GBRG
  demosaic: bilinear
  demosaic_srgb: true
sensor_forward:
  model:
    electrons_scale: 25000.0
    include_surround: true
    surround_reflectance: 0.22
    calibration:
      mode: photon_counting
      # With radiometric_autocalibration (mean_photopic_lux) the EXR autocal
      # scale alone pins the absolute level, so the chart-mode unit convention
      # must be 1.0 (in chart mode it cancels against the illuminant-CSV lux
      # normalization; in autocal mode it would wrongly rescale the result).
      irradiance_scale_W_m2nm_per_unit: 1.0
      # No illuminant_override_csv: a chart-style illuminant CSV would apply
      # the lux normalization a second time on top of the EXR autocal.
      # target_illuminance_lux is the mean SENSOR-PLANE photopic lux
      # (E = pi*L/(4 N^2) * tau). ~125 exposes a sunlit highway well (road
      # ~30% of full well) with the 5:1 sun-dominant illumination balance.
      target_illuminance_lux: 125.0
      optics_transmittance: 1.0
      use_aperture_factor: true
    cosine_shading: true
    chart_normal:
    - 0.0
    - 0.0
    - 1.0
    vignetting_cos4: false
    pbrt_spectral_exr:
      radiance_to_irradiance: thin_lens
      radiance_to_irradiance_scale: null
      extra_irradiance_scale: 1.0
      radiometric_autocalibration: mean_photopic_lux
validation:
  monte_carlo_trials: 20000
  random_seed: 0
  variance_rtol: 0.07
  mean_abs_dn_atol: 0.22
  ptc_mu_e_levels:
  - 0.0
  - 400.0
  - 2000.0
  - 3500.0
  - 4700.0
  datasheet:
    enabled: false
source:
  calibration_tier: research
  notes: Realistic traced-lens baseline using the available wide_22mm lens file.
