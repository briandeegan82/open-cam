# Delta from config/sensor_models/default.yaml — only overrides are listed.
schema_version: 1
sensor:
  quantum_efficiency:
    green_csv: spectra/QE/interpolated/QE_yellow.csv
    blue_csv: spectra/QE/interpolated/QE_cyan.csv
source:
  qe_variant: default_ryycy
  qe_variant_note: 'True periodic CFA via cfa.layout (per-channel spectral QE). quantum_efficiency keeps the legacy 3-channel proxy for RGB-only tools; set cfa.layout: null and cfa.demosaic: malvar for the old proxy behaviour. Old note: RYYCy approximated as RGB channels: R, Y->G, Cy->B'
model:
  name: default_ryycy
  display_name: Default RYYCy (true CFA)
cfa:
  layout: RYYCY
  demosaic: gradient
