# Delta from config/sensor_models/default.yaml — iPhone 8 sensor with an RGGB CFA.
# Identical to iphone_8.yaml except cfa.pattern is forced to RGGB (the default
# sensor pattern is GBRG). Used for the D65 / RGGB overexposure dataset.
schema_version: 1
sensor:
  quantum_efficiency:
    red_csv: spectra/QE/cameras/iphone_8/QE_red.csv
    green_csv: spectra/QE/cameras/iphone_8/QE_green.csv
    blue_csv: spectra/QE/cameras/iphone_8/QE_blue.csv
    # ircf_csv: null — iPhone 8 QE curves are full-system spectral sensitivities
    # (Image Engineering database, measured on device) that already include the IRCF.
    ircf_csv: null
  f_number: 1.8
  fill_factor: 0.76
noise:
  emva:
    overall_system_gain_K_e_per_DN: 9.9062  # base ISO gain (full_well / usable_DN)
    iso_gain_factor: 1.0
    sigma_d_e: 1.6
    black_level_DN: 64
    prnu_std_fraction: 0.018
    dsnu_std_e: 0.16
    dark_current_e_per_s: 0.25
  adc:
    full_well_e: 9500
cfa:
  pattern: RGGB
  # Override the sensor-default demosaic (malvar) so the recipe/full-model paths
  # agree: bilinear everywhere for this sensor.
  demosaic: bilinear
  spatial_crosstalk:
    enabled: true
validation:
  mean_abs_dn_atol: 0.06
  ptc_mu_e_levels:
  - 0.0
  - 800.0
  - 4000.0
  - 6900.0
  - 9300.0
  datasheet:
    overall_system_gain_K_e_per_DN: 9.9062
    temporal_dark_noise_sigma_d_e: 1.6
    full_well_e: 9500
    black_level_DN: 64
    bit_depth: 10
    gain_convention: e_per_dn
    source: K corrected to base-ISO gain (full_well_e / usable_DN) for ADC consistency.
      Original web-scraped K was 0.22 e/DN (measured at amplified ISO). Other parameters
      unchanged from scraped internet table (2026-04-24).
source:
  qe_workbook: spectra/QE/Spectral_sensitivities_IE.xlsx
  sheet: Data
  emva_param_method: inferred_web_table_v1
  sensor_class: phone
  emva_gain_note: K corrected from web-scraped 0.22 e/DN to base-ISO 9.906 e/DN (=
    full_well_e / usable_DN) for ADC self-consistency
model:
  name: iphone_8_rggb
  display_name: iPhone 8 (RGGB CFA)
