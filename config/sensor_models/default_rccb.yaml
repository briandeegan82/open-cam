# Delta from config/sensor_models/default.yaml — only overrides are listed.
schema_version: 1
sensor:
  quantum_efficiency:
    green_csv: spectra/QE/interpolated/QE_cyan.csv
source:
  qe_variant: default_rccb
  qe_variant_note: 'True periodic CFA via cfa.layout (per-channel spectral QE). quantum_efficiency keeps the legacy 3-channel proxy for RGB-only tools; set cfa.layout: null and cfa.demosaic: malvar for the old proxy behaviour. Old note: RCCB approximated as RGB channels: R, C->G, B'
model:
  name: default_rccb
  display_name: Default RCCB (true CFA)
cfa:
  layout: RCCB
  demosaic: gradient
