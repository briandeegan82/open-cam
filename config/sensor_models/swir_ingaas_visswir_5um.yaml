# Delta from config/sensor_models/default.yaml — only overrides are listed.
# Representative substrate-removed "VisSWIR" InGaAs sensor, 5 um pitch, 0.4-1.7 um
# (IMX990-class; not product-matched). Visible QE assumes a 20 nm InP cap
# (tools/swir_spectra.py). Dark current scaled from the 15 um model by pixel area.
schema_version: 1
source:
  qe_variant: swir_ingaas_visswir
  qe_variant_note: 'Monochrome InGaAs via a 1x1 cfa.layout (see docs/SWIR.md)'
model:
  name: swir_ingaas_visswir_5um
  display_name: SWIR VisSWIR InGaAs 5 um, 0.4-1.7 um (representative)
sensor:
  pixel_pitch_um: 5.0
  integration_time_s: 0.005
  f_number: 1.4
  fill_factor: 1.0
noise:
  emva:
    overall_system_gain_K_e_per_DN: 1.2
    sigma_d_e: 30.0
    black_level_DN: 64
    prnu_std_fraction: 0.02
    dark_current_e_per_s: 7800.0
    dark_current_reference_temp_c: 20.0
    temperature_c: 15.0
    dark_current_doubling_per_c: 8.0
  adc:
    bit_depth: 12
    full_well_e: 5000
cfa:
  layout: [[S]]
  demosaic: bilinear
  ircf: false
  channels:
    S: {qe_csv: spectra/QE/swir/QE_ingaas_visswir.csv}
