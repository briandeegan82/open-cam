# Delta from config/sensor_models/default.yaml — only overrides are listed.
schema_version: 1
sensor:
  quantum_efficiency:
    red_csv: spectra/QE/interpolated/QE_cyan.csv
    green_csv: spectra/QE/interpolated/QE_magenta.csv
    blue_csv: spectra/QE/interpolated/QE_yellow.csv
source:
  qe_variant: default_cmy
  qe_variant_note: 'True periodic CFA via cfa.layout (per-channel spectral QE). quantum_efficiency keeps the legacy 3-channel proxy for RGB-only tools; set cfa.layout: null for the old proxy behaviour. Old note: CMY approximated as RGB channels: C->R, M->G, Y->B'
model:
  name: default_cmy
  display_name: Default CMY (true CFA)
cfa:
  layout: CMY
  demosaic: gradient
