name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Pipeline tests
        run: python -m pytest tests -q
      - name: GUI tests
        working-directory: gui
        run: python -m pytest -q
      - name: Pipeline dry run
        run: python tools/run_pipeline.py --config config/pipeline.yaml --dry-run

  pbrt-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Resolve pbrt-v4 revision
        id: pbrt
        run: echo "sha=$(git rev-parse HEAD:third_party/pbrt-v4)" >> "$GITHUB_OUTPUT"
      - name: Cache pbrt binary
        id: pbrt-cache
        uses: actions/cache@v4
        with:
          path: third_party/pbrt-v4/build/pbrt
          key: pbrt-v4-cpu-portable-${{ runner.os }}-${{ steps.pbrt.outputs.sha }}-${{ hashFiles('third_party/patches/*.patch', 'tools/build_pbrt.sh') }}
      - name: Install runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libgl-dev libwayland-dev libxkbcommon-dev wayland-protocols pkg-config cmake
      - name: Build pbrt-v4 (CPU, with third_party/patches applied)
        if: steps.pbrt-cache.outputs.cache-hit != 'true'
        run: tools/build_pbrt.sh  # applies third_party/patches/*.patch, then builds
        env:
          PBRT_NATIVE: "OFF"  # no -march=native: the cached binary must run on any runner CPU
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: End-to-end render test
        env:
          OPENCAM_REQUIRE_PBRT: "1"
        run: python -m pytest tests/test_pbrt_e2e.py tests/test_pbrt_full_pipeline.py tests/test_highway_night.py tests/test_highway_spectral_sky.py -v
