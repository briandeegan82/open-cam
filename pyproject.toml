# Root tooling config for the pipeline tools (tools/, tests/).
# The GUI package has its own gui/pyproject.toml.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["third_party", "venv", "out", "scenes/generated"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM"]
# E501: ruff format wraps code at line-length; remaining overruns are long string literals.
# UP031 / SIM108 / B905: legacy style, rewriting %-formats, if/else blocks and zip() calls has no payoff.
ignore = ["E501", "UP031", "SIM108", "B905"]

[tool.ruff.lint.per-file-ignores]
# Scripts insert tools/ on sys.path before importing sibling modules.
"tools/*.py" = ["E402"]
