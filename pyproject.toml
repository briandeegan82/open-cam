# Root tooling config for the pipeline tools (tools/, tests/).
# The GUI package has its own gui/pyproject.toml.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["third_party", "venv", "out", "scenes/generated"]

[tool.ruff.lint]
# Gate on real errors (undefined names, unused imports, syntax); style rules can be
# tightened incrementally once the existing line-length debt is paid down.
select = ["F", "E9"]
