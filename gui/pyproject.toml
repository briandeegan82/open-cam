[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencam-gui"
version = "0.1.0"
description = "Interactive GUI + tutorials for Open Cam (geometry, optics, MTF, sensor, exposure, colour/ISP, image generation)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open Cam" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "dearpygui>=1.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
opencam-gui = "opencam_gui.ui.cli:main"
opencam-studio = "opencam_gui.studio.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opencam_gui*"]

[tool.setuptools.package-data]
"opencam_gui.studio" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
